
set vicmd=nvim                  " Use Neovim for external file editing
set trash                       " Use systems trash layout instead of raw deletes
set history=100                 " Number of command line lines to remember
set nofollowlinks               " Do not follow symlinks blindly on selection
set sort=name                   " Default file sorting strategy
set undolevels=100              " Maximum number of changes that can be undone

" Use standard Vim keys for structural navigation
nnoremap j j
nnoremap k k
nnoremap h h
nnoremap l l

" Use Ctrl + W twice to quickly switch focus between Vifm and your Zsh shell
nnoremap <C-w><C-w> <C-w>w

" Modern 24-bit TrueColor profile theme
colorscheme onedark

" Remove legacy dashed border grids and inject clean Unicode solid borders
set fillchars=vsep:│,hsep:─,top:─,toptm:┬,topleft:┌,topright:┐,bot:─,botm:┴,botleft:└,botright:┘

" Clean column layout: fluid filename matching, short extensions, and small file metrics
set viewcolumns=-*{name},..{ext},6{size}

" Show status bar information cleanly at the bottom
set statusline=" %t %M %R [%A] %x %-20{t} %20{b} %04l/%04L %p%% "

" Map modern glyph markers based on common file extensions and folders
set classify="{d:   :,f:   :}"

" Explicit file type icons
vifm_image   [*.jpg,*.jpeg,*.png,*.gif,*.svg,*.webp]   {f:   :}
vifm_archive [*.zip,*.tar,*.gz,*.bz2,*.xz,*.rar,*.7z]  {f:   :}
vifm_code    [*.py,*.sh,*.zsh,*.js,*.ts,*.rs,*.conf,*.ini,*.json] {f:   :}
vifm_doc     [*.md,*.txt,*.pdf,*.doc,*.docx,*.csv]     {f:   :}

" ------------------------------------------------------------------------------
" 4. DYNAMIC 30/70 INTERACTIVE SHELL SPLIT SEQUENCE
" ------------------------------------------------------------------------------
" Step A: Spin up your native Zsh terminal emulator directly on the right hand pane
windo if &only | vsplit term://zsh | endif

" Step B: Shrink the file manager panel width down to exactly 30% of the screen
vertical resize 30

" Step C: Throw the cursor focus straight into the Zsh shell window upon execution
wincmd l
